<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris_Error.exe Intro UI Editor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { box-sizing: border-box; }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 390px;
            overflow: hidden;
            background: #141426;
            color: #f4f4ff;
            font-family: Arial, sans-serif;
        }

        .preview {
            position: relative;
            min-width: 0;
            min-height: 100vh;
            overflow: hidden;
            background: #1a1a2e;
        }

        .preview::before {
            content: " ";
            position: absolute;
            inset: 0;
            z-index: 200;
            pointer-events: none;
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
        }

        .game-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            --board-shell-width: 332px;
            --side-gap: 20px;
            --hold-panel-width: 110px;
        }

        .canvas-outer {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 10;
            display: flex;
            padding: 10px;
            background: #222;
            border: 4px solid #444;
            box-shadow: 10px 10px 0 #000;
            transform: translate(-50%, -50%);
        }

        .canvas-container {
            width: 300px;
            height: 690px;
            background: #020204;
            border: 2px solid #111;
            background-image:
                linear-gradient(#151515 1px, transparent 1px),
                linear-gradient(90deg, #151515 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .hold-panel,
        .score-panel {
            position: absolute;
            z-index: 9;
            display: flex;
        }

        .hold-panel {
            left: calc(50% - (var(--board-shell-width) / 2) - var(--side-gap) - var(--hold-panel-width));
            top: 50%;
            width: 110px;
            height: 110px;
            padding: 4px;
            background: #000;
            border: 4px solid #444;
            box-shadow: 6px 6px 0 #000;
            transform: translateY(-170px);
        }

        .hold-box {
            display: block;
            width: 94px;
            height: 94px;
            background: #000;
            border: 2px solid #111;
        }

        .score-panel {
            left: calc(50% + (var(--board-shell-width) / 2) + var(--side-gap));
            top: 50%;
            min-width: 188px;
            padding: 20px;
            flex-direction: column;
            background: rgba(22, 22, 40, 0.9);
            border: 4px solid #444;
            box-shadow: 6px 6px 0 #000;
            text-align: right;
            font-family: 'Press Start 2P', cursive;
            transform: translateY(-100px);
        }

        .score-label {
            margin-bottom: 10px;
            color: #ff99cc;
            font-size: 10px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 #000;
        }

        .score-value {
            margin-bottom: 24px;
            color: #fff;
            font-size: 18px;
            text-shadow: 3px 3px 0 #000;
        }

        .target-value {
            color: #fff06a;
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            border: 2px solid #fff;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 0 2px #000;
        }

        .progress-fill {
            width: 34%;
            height: 100%;
            background: linear-gradient(90deg, #ff99cc, #fff06a);
        }

        .intro-overlay {
            position: absolute;
            inset: 0;
            z-index: 220;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 48%, rgba(255, 240, 106, 0.12), rgba(255, 240, 106, 0) 34%),
                linear-gradient(180deg, rgba(12, 12, 22, 0.18), rgba(0, 0, 0, 0.26));
        }

        .intro-stage {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 18px;
            padding: var(--intro-y, 28vh) 24px 24px;
            transform: translateX(var(--intro-x, 0vw));
        }

        .intro-text {
            position: relative;
            margin: 0;
            color: var(--intro-color, #fff06a);
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(32px, var(--intro-size, 3vw), 152px);
            font-weight: 900;
            letter-spacing: 2px;
            white-space: nowrap;
            text-shadow:
                0 0 8px rgba(255, 240, 106, 0.8),
                0 0 18px rgba(255, 240, 106, 0.55),
                4px 4px 0 #000;
            animation: introBurst var(--intro-duration, 900ms) cubic-bezier(0.18, 0.9, 0.22, 1) both;
        }

        .intro-text::after {
            content: attr(data-text);
            position: absolute;
            inset: 0;
            pointer-events: none;
            color: transparent;
            background:
                repeating-linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.9) 0 2px,
                    rgba(0, 0, 0, 0.22) 2px 4px,
                    rgba(255, 240, 106, 0.62) 4px 5px
                );
            -webkit-background-clip: text;
            background-clip: text;
            opacity: var(--stripe-opacity, 0.8);
            mix-blend-mode: screen;
            text-shadow: none;
            animation: introTextScanline 0.22s steps(2, end) infinite;
        }

        .phase3-guide {
            position: fixed;
            left: 0;
            right: 0;
            top: var(--phase3-guide-y, 50vh);
            z-index: 4;
            padding: 0 24px;
            color: #ff3030;
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(24px, var(--phase3-guide-size, 3vw), 152px);
            line-height: 1.35;
            text-align: center;
            white-space: pre-line;
            text-shadow:
                0 0 8px rgba(255, 48, 48, 0.9),
                0 0 18px rgba(255, 48, 48, 0.58),
                4px 4px 0 #000;
            opacity: 0;
            pointer-events: none;
            transform: translate(var(--phase3-guide-x, 0vw), -50%) scale(0.92);
        }

        .phase3-guide.show {
            animation: phase3GuideBurst var(--phase3-guide-duration, 1350ms) cubic-bezier(0.18, 0.9, 0.22, 1) both;
        }

        .phase3-guide.previewing {
            opacity: 1;
            transform: translate(var(--phase3-guide-x, 0vw), -50%) scale(1);
        }

        @keyframes introBurst {
            0% { transform: translateY(18px) scale(0.82); opacity: 1; }
            18% { opacity: 1; }
            48% { transform: translateY(-2px) scale(1.04); opacity: 1; }
            74% { transform: translateY(-6px) scale(1); opacity: 0.72; }
            100% { transform: translateY(-12px) scale(1.02); opacity: 0; }
        }

        @keyframes introTextScanline {
            0% { opacity: calc(var(--stripe-opacity, 0.8) - 0.08); transform: translateY(0); }
            50% { opacity: var(--stripe-opacity, 0.8); transform: translateY(1px); }
            100% { opacity: calc(var(--stripe-opacity, 0.8) - 0.04); transform: translateY(0); }
        }

        @keyframes phase3GuideBurst {
            0% { opacity: 0; transform: translate(var(--phase3-guide-x, 0vw), calc(-50% + 18px)) scale(0.72); filter: blur(2px); }
            16% { opacity: 1; transform: translate(var(--phase3-guide-x, 0vw), -50%) scale(1.06); filter: blur(0); }
            68% { opacity: 1; transform: translate(var(--phase3-guide-x, 0vw), -50%) scale(1); }
            100% { opacity: 0; transform: translate(var(--phase3-guide-x, 0vw), -50%) scale(0.22); filter: blur(1px); }
        }

        aside {
            height: 100vh;
            padding: 22px;
            overflow: auto;
            background: #0d0d14;
            border-left: 1px solid rgba(255, 255, 255, 0.14);
        }

        h1 {
            margin: 0 0 18px;
            color: #fff06a;
            font-family: 'Press Start 2P', cursive;
            font-size: 15px;
            line-height: 1.5;
        }

        h2 {
            margin: 22px 0 8px;
            color: #ff99cc;
            font-size: 14px;
        }

        label {
            display: grid;
            gap: 7px;
            margin: 14px 0;
            color: #d8d8e8;
            font-size: 13px;
        }

        input,
        button,
        textarea,
        select {
            width: 100%;
            font: inherit;
        }

        input,
        select {
            padding: 9px;
            color: #fff;
            background: #050508;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        textarea {
            min-height: 84px;
            padding: 10px;
            color: #fff;
            background: #050508;
            border: 1px solid rgba(255, 255, 255, 0.2);
            line-height: 1.6;
            resize: vertical;
        }

        input[type="range"] {
            padding: 0;
            accent-color: #fff06a;
        }

        button {
            margin-top: 10px;
            padding: 12px 14px;
            border: 0;
            background: #ff99cc;
            color: #000;
            font-weight: 800;
            cursor: pointer;
        }

        button.secondary {
            background: #fff06a;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .status {
            min-height: 20px;
            margin-top: 12px;
            color: #aaaabb;
            font-size: 12px;
            line-height: 1.5;
        }

        textarea {
            min-height: 210px;
            margin-top: 14px;
            padding: 12px;
            color: #d7fce6;
            background: #050508;
            border: 1px solid rgba(255, 255, 255, 0.2);
            resize: vertical;
            font-family: "Courier New", monospace;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main class="preview">
        <div class="game-wrapper">
            <div class="hold-panel">
                <div class="hold-box"></div>
            </div>

            <div class="canvas-outer">
                <div class="canvas-container"></div>
            </div>

            <div class="score-panel">
                <div class="score-label">SCORE</div>
                <div class="score-value">0</div>
                <div class="score-label">TARGET</div>
                <div class="score-value target-value">1,500</div>
                <div class="score-label">COMBO</div>
                <div class="score-value">0</div>
                <div class="score-label">PROGRESS</div>
                <div class="progress-bar"><div class="progress-fill"></div></div>
            </div>
        </div>

        <div class="intro-overlay">
            <div class="intro-stage" id="stage">
                <div class="intro-text" id="intro-text" data-text="3">3</div>
            </div>
            <div class="phase3-guide" id="phase3-guide">2분 안에 악마를 쓰러뜨리세요!
방향키 사용 가능</div>
        </div>
    </main>

    <aside>
        <h1>INTRO UI EDITOR</h1>

        <label>즉시 확인할 텍스트
            <select id="preview-phase">
                <option value="3">3</option>
                <option value="2">2</option>
                <option value="1">1</option>
                <option value="START!!">START!!</option>
            </select>
        </label>

        <label>Y 위치(vh): <span id="y-value">45</span>
            <input id="intro-y" type="range" min="0" max="45" value="45">
        </label>

        <label>X 위치(vw): <span id="x-value">0</span>
            <input id="intro-x" type="range" min="-40" max="40" step="0.5" value="0">
        </label>

        <label>숫자/START 크기(vw): <span id="size-value">3</span>
            <input id="intro-size" type="range" min="3" max="18" step="0.1" value="3">
        </label>

        <label>텍스트 줄무늬 강도: <span id="stripe-value">0.8</span>
            <input id="stripe-opacity" type="range" min="0" max="0.8" step="0.01" value="0.8">
        </label>

        <label>3/2/1 페이드 시간(ms): <span id="number-duration-value">550</span>
            <input id="number-duration" type="range" min="400" max="1600" step="50" value="550">
        </label>

        <label>START 페이드 시간(ms): <span id="start-duration-value">1050</span>
            <input id="start-duration" type="range" min="500" max="2200" step="50" value="1050">
        </label>

        <h2>페이즈 3 안내문구</h2>

        <label>안내 문구
            <textarea id="phase3-guide-text" rows="3">2분 안에 악마를 쓰러뜨리세요!
방향키 사용 가능</textarea>
        </label>

        <label>안내 Y 위치(vh): <span id="phase3-guide-y-value">50</span>
            <input id="phase3-guide-y" type="range" min="12" max="82" step="0.5" value="50">
        </label>

        <label>안내 X 위치(vw): <span id="phase3-guide-x-value">0</span>
            <input id="phase3-guide-x" type="range" min="-36" max="36" step="0.5" value="0">
        </label>

        <label>안내 크기(vw): <span id="phase3-guide-size-value">3</span>
            <input id="phase3-guide-size" type="range" min="1.8" max="8" step="0.1" value="3">
        </label>

        <label>안내 표시 시간(ms): <span id="phase3-guide-duration-value">1350</span>
            <input id="phase3-guide-duration" type="range" min="700" max="2800" step="50" value="1350">
        </label>

        <div class="button-grid">
            <button onclick="playIntro()">PLAY FULL</button>
            <button onclick="replayCurrent()">REPLAY CURRENT</button>
            <button class="secondary" onclick="showPhase('3')">SHOW 3</button>
            <button class="secondary" onclick="showPhase('START!!')">SHOW START</button>
            <button class="secondary" onclick="showPhase3Guide()">SHOW PHASE 3</button>
        </div>

        <button onclick="copyConfig()">COPY CONFIG</button>

        <div class="status" id="status">메인 게임의 현재 중앙 정렬 UI 기준 미리보기입니다.</div>
        <textarea id="output" readonly></textarea>
    </aside>

    <script>
        const stage = document.getElementById('stage');
        const introText = document.getElementById('intro-text');
        const phase3Guide = document.getElementById('phase3-guide');
        const phaseInput = document.getElementById('preview-phase');
        const yInput = document.getElementById('intro-y');
        const xInput = document.getElementById('intro-x');
        const sizeInput = document.getElementById('intro-size');
        const stripeInput = document.getElementById('stripe-opacity');
        const numberDurationInput = document.getElementById('number-duration');
        const startDurationInput = document.getElementById('start-duration');
        const phase3GuideTextInput = document.getElementById('phase3-guide-text');
        const phase3GuideYInput = document.getElementById('phase3-guide-y');
        const phase3GuideXInput = document.getElementById('phase3-guide-x');
        const phase3GuideSizeInput = document.getElementById('phase3-guide-size');
        const phase3GuideDurationInput = document.getElementById('phase3-guide-duration');
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        let timers = [];

        function getIntroConfig() {
            return {
                yVh: Number(yInput.value),
                xVw: Number(xInput.value),
                sizeVw: Number(sizeInput.value),
                stripeOpacity: Number(stripeInput.value),
                numberDurationMs: Number(numberDurationInput.value),
                startDurationMs: Number(startDurationInput.value)
            };
        }

        function getPhase3GuideConfig() {
            return {
                text: phase3GuideTextInput.value,
                xVw: Number(phase3GuideXInput.value),
                yVh: Number(phase3GuideYInput.value),
                sizeVw: Number(phase3GuideSizeInput.value),
                durationMs: Number(phase3GuideDurationInput.value)
            };
        }

        function getConfig() {
            return {
                intro: getIntroConfig(),
                phase3Guide: getPhase3GuideConfig()
            };
        }

        function getDurationForText(text) {
            return text === 'START!!'
                ? Number(startDurationInput.value)
                : Number(numberDurationInput.value);
        }

        function applyConfig() {
            const config = getIntroConfig();
            const phase3GuideConfig = getPhase3GuideConfig();
            stage.style.setProperty('--intro-y', `${config.yVh}vh`);
            stage.style.setProperty('--intro-x', `${config.xVw}vw`);
            introText.style.setProperty('--intro-size', `${config.sizeVw}vw`);
            introText.style.setProperty('--stripe-opacity', config.stripeOpacity);
            phase3Guide.textContent = phase3GuideConfig.text;
            phase3Guide.style.setProperty('--phase3-guide-y', `${phase3GuideConfig.yVh}vh`);
            phase3Guide.style.setProperty('--phase3-guide-x', `${phase3GuideConfig.xVw}vw`);
            phase3Guide.style.setProperty('--phase3-guide-size', `${phase3GuideConfig.sizeVw}vw`);
            phase3Guide.style.setProperty('--phase3-guide-duration', `${phase3GuideConfig.durationMs}ms`);
            document.getElementById('y-value').textContent = config.yVh;
            document.getElementById('x-value').textContent = config.xVw;
            document.getElementById('size-value').textContent = config.sizeVw.toFixed(1).replace('.0', '');
            document.getElementById('stripe-value').textContent = config.stripeOpacity.toFixed(2);
            document.getElementById('number-duration-value').textContent = config.numberDurationMs;
            document.getElementById('start-duration-value').textContent = config.startDurationMs;
            document.getElementById('phase3-guide-y-value').textContent = phase3GuideConfig.yVh;
            document.getElementById('phase3-guide-x-value').textContent = phase3GuideConfig.xVw;
            document.getElementById('phase3-guide-size-value').textContent = phase3GuideConfig.sizeVw.toFixed(1).replace('.0', '');
            document.getElementById('phase3-guide-duration-value').textContent = phase3GuideConfig.durationMs;
            output.value = JSON.stringify(getConfig(), null, 2);
        }

        function clearTimers() {
            timers.forEach(timer => clearTimeout(timer));
            timers = [];
        }

        function showText(text, color, duration) {
            applyConfig();
            phase3Guide.classList.remove('show', 'previewing');
            introText.textContent = text;
            introText.dataset.text = text;
            introText.style.setProperty('--intro-color', color);
            introText.style.setProperty('--intro-duration', `${duration}ms`);
            introText.classList.remove('intro-text');
            void introText.offsetWidth;
            introText.classList.add('intro-text');
            phaseInput.value = text;
            status.textContent = `${text} 미리보기 중`;
        }

        function showPhase3Guide(animate = true) {
            clearTimers();
            applyConfig();
            introText.textContent = '';
            introText.dataset.text = '';
            phase3Guide.classList.remove('show', 'previewing');
            void phase3Guide.offsetWidth;
            phase3Guide.classList.add(animate ? 'show' : 'previewing');
            status.textContent = animate ? '페이즈 3 안내문구 미리보기 중' : '페이즈 3 안내문구 위치 조정 중';
        }

        function showPhase(text) {
            clearTimers();
            showText(text, '#fff06a', getDurationForText(text));
        }

        function replayCurrent() {
            showPhase(phaseInput.value);
        }

        function playIntro() {
            clearTimers();
            applyConfig();
            const config = getIntroConfig();
            const phases = [
                { text: '3', color: '#fff06a', duration: config.numberDurationMs },
                { text: '2', color: '#fff06a', duration: config.numberDurationMs },
                { text: '1', color: '#fff06a', duration: config.numberDurationMs },
                { text: 'START!!', color: '#fff06a', duration: config.startDurationMs }
            ];

            let cursor = 0;
            phases.forEach(phase => {
                timers.push(setTimeout(() => showText(phase.text, phase.color, phase.duration), cursor));
                cursor += phase.duration;
            });
            timers.push(setTimeout(() => {
                status.textContent = '전체 인트로 재생 완료';
                timers = [];
            }, cursor));
        }

        function copyConfig() {
            applyConfig();
            navigator.clipboard.writeText(output.value).then(() => {
                status.textContent = 'CONFIG 복사됨';
            }).catch(() => {
                output.focus();
                output.select();
                status.textContent = '복사 실패: 출력창에서 직접 복사하세요.';
            });
        }

        [
            yInput,
            xInput,
            sizeInput,
            stripeInput,
            numberDurationInput,
            startDurationInput,
            phase3GuideTextInput,
            phase3GuideYInput,
            phase3GuideXInput,
            phase3GuideSizeInput,
            phase3GuideDurationInput
        ].forEach(input => {
            input.addEventListener('input', () => {
                applyConfig();
                if (input.id.startsWith('phase3-guide')) {
                    showPhase3Guide(false);
                } else {
                    replayCurrent();
                }
            });
        });

        phaseInput.addEventListener('change', () => showPhase(phaseInput.value));

        applyConfig();
        showPhase3Guide(false);
    </script>
</body>
</html>
