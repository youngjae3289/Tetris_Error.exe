<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris_Error.exe Wall Kick Test</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { box-sizing: border-box; }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            overflow: hidden;
            background: #141426;
            color: #f4f4ff;
            font-family: Arial, sans-serif;
        }

        main {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 100vh;
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05)),
                #1a1a2e;
            background-size: 100% 4px, 3px 100%, auto;
        }

        .canvas-shell {
            padding: 10px;
            background: #222;
            border: 4px solid #444;
            box-shadow: 10px 10px 0 #000;
        }

        canvas {
            display: block;
            width: 300px;
            height: 690px;
            background: #020204;
            border: 2px solid #111;
            image-rendering: pixelated;
            cursor: crosshair;
        }

        aside {
            height: 100vh;
            padding: 22px;
            overflow: auto;
            background: #0d0d14;
            border-left: 1px solid rgba(255, 255, 255, 0.14);
        }

        h1 {
            margin: 0 0 18px;
            color: #fff06a;
            font-family: 'Press Start 2P', cursive;
            font-size: 15px;
            line-height: 1.5;
        }

        .panel {
            margin: 16px 0;
            padding: 14px;
            background: rgba(22, 22, 40, 0.9);
            border: 4px solid #444;
            box-shadow: 6px 6px 0 #000;
        }

        .label {
            margin-bottom: 8px;
            color: #ff99cc;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            line-height: 1.6;
        }

        p,
        li {
            color: #d8d8e8;
            font-size: 13px;
            line-height: 1.65;
        }

        ul {
            margin: 8px 0 0;
            padding-left: 18px;
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 12px 14px;
            border: 0;
            background: #ff99cc;
            color: #000;
            font-weight: 800;
            cursor: pointer;
        }

        button.secondary {
            background: #fff06a;
        }

        .status {
            min-height: 22px;
            margin-top: 12px;
            color: #aaaabb;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <main>
        <div class="canvas-shell">
            <canvas id="test-canvas" width="300" height="690"></canvas>
        </div>
    </main>

    <aside>
        <h1>WALL KICK TEST</h1>

        <div class="panel">
            <div class="label">조작</div>
            <ul>
                <li>A / D: 이동</li>
                <li>W / Space: 점프, 벽차기</li>
                <li>S: 공중 급강하</li>
                <li>마우스 드래그: 에러블록 배치</li>
                <li>블록 클릭: 선택</li>
                <li>Delete / Backspace: 선택 블록 삭제</li>
            </ul>
        </div>

        <div class="panel">
            <div class="label">테스트 팁</div>
            <p>세로 벽을 만들고 공중에서 벽 방향으로 밀면서 점프해보세요. 벽에 붙으면 살짝 미끄러지고, 점프하면 반대 방향으로 튕깁니다.</p>
        </div>

        <button onclick="resetPlayer()">RESET PLAYER</button>
        <button class="secondary" onclick="clearBlocks()">CLEAR BLOCKS</button>
        <button class="secondary" onclick="makeWallCourse()">MAKE WALL COURSE</button>

        <div class="status" id="status">드래그해서 에러블록을 배치하세요.</div>
    </aside>

    <script>
        const canvas = document.getElementById('test-canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        const BLOCK = 30;
        const COLS = 10;
        const ROWS = 23;
        const keys = {};
        const keysPressed = {};
        const blocks = [];
        const particles = [];

        let selectedBlock = null;
        let draggingBlock = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let lastTime = performance.now();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = -Math.random() * 4 - 1;
                this.life = 1;
                this.size = Math.random() * 2 + 1.5;
                this.color = color;
            }

            update(dt) {
                this.x += this.vx * 60 * dt;
                this.y += this.vy * 60 * dt;
                this.vy += 12 * dt;
                this.life -= 2.4 * dt;
            }

            draw() {
                ctx.globalAlpha = Math.max(this.life, 0);
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }
        }

        class Player {
            constructor() {
                this.w = 18;
                this.h = 26;
                this.x = canvas.width / 2 - this.w / 2;
                this.y = canvas.height - this.h;
                this.vx = 0;
                this.vy = 0;
                this.speed = 220;
                this.jumpForce = -450;
                this.gravity = 1400;
                this.fastFallGravity = 3000;
                this.isGrounded = false;
                this.wallDir = 0;
                this.wallContactTimer = 0;
                this.wallJumpLockTimer = 0;
                this.wallJumpVx = 0;
                this.wallJumpPush = 310;
                this.wallJumpForce = -430;
                this.wallSlideMaxFall = 175;
                this.lastDir = 1;
                this.bumpDir = 0;
            }

            update(dt) {
                this.wallContactTimer = Math.max(0, this.wallContactTimer - dt);
                this.wallJumpLockTimer = Math.max(0, this.wallJumpLockTimer - dt);

                if (this.wallJumpLockTimer > 0) {
                    this.vx = this.wallJumpVx;
                } else if (keys.KeyA) {
                    this.vx = -this.speed;
                } else if (keys.KeyD) {
                    this.vx = this.speed;
                } else {
                    this.vx = 0;
                }

                if (keys.KeyS && !this.isGrounded) {
                    this.vy += this.fastFallGravity * dt;
                } else {
                    this.vy += this.gravity * dt;
                }
                this.vy = Math.min(this.vy, 800);

                this.x += this.vx * dt;
                let bumped = 0;

                if (this.x < 0) {
                    this.x = 0;
                    if (this.vx < 0) bumped = -1;
                }
                if (this.x + this.w > canvas.width) {
                    this.x = canvas.width - this.w;
                    if (this.vx > 0) bumped = 1;
                }

                for (let block of blocks) {
                    if (rectIntersect(this, block)) {
                        if (this.vx > 0) {
                            this.x = block.x - this.w;
                            bumped = 1;
                        } else if (this.vx < 0) {
                            this.x = block.x + block.w;
                            bumped = -1;
                        }
                    }
                }

                this.bumpDir = bumped;
                if (bumped !== 0 && !this.isGrounded) {
                    this.wallDir = bumped;
                    this.wallContactTimer = 0.14;
                    if (this.vy > this.wallSlideMaxFall && ((bumped < 0 && keys.KeyA) || (bumped > 0 && keys.KeyD))) {
                        this.vy = this.wallSlideMaxFall;
                    }
                }

                let jumpPressed = keysPressed.KeyW || keysPressed.Space;
                if (jumpPressed) {
                    if (this.isGrounded) {
                        this.vy = this.jumpForce;
                        this.isGrounded = false;
                        this.wallContactTimer = 0;
                        this.wallDir = 0;
                    } else if (this.wallContactTimer > 0 && this.wallDir !== 0) {
                        this.vy = this.wallJumpForce;
                        this.wallJumpVx = -this.wallDir * this.wallJumpPush;
                        this.vx = this.wallJumpVx;
                        this.wallJumpLockTimer = 0.16;
                        this.wallContactTimer = 0;
                        this.x += -this.wallDir * 2;
                        this.lastDir = -this.wallDir;
                        burstWallKickParticles(this.wallDir < 0 ? this.x : this.x + this.w, this.y + this.h * 0.52, this.wallDir);
                    }
                    keysPressed.KeyW = false;
                    keysPressed.Space = false;
                }

                this.y += this.vy * dt;
                this.isGrounded = false;

                for (let block of blocks) {
                    if (rectIntersect(this, block)) {
                        if (this.vy > 0) {
                            this.y = block.y - this.h;
                            this.vy = 0;
                            this.isGrounded = true;
                            this.wallContactTimer = 0;
                            this.wallDir = 0;
                        } else if (this.vy < 0) {
                            this.y = block.y + block.h;
                            this.vy = 0;
                        }
                    }
                }

                if (this.y + this.h > canvas.height) {
                    this.y = canvas.height - this.h;
                    this.vy = 0;
                    this.isGrounded = true;
                    this.wallContactTimer = 0;
                    this.wallDir = 0;
                }

                if (this.vx > 0) this.lastDir = 1;
                else if (this.vx < 0) this.lastDir = -1;
            }

            draw() {
                let color = this.wallContactTimer > 0 && !this.isGrounded ? '#fff06a' : '#a3e4d7';
                ctx.save();
                ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
                ctx.scale(this.lastDir, 1);
                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 12;
                ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(1, -8, 4, 4);
                ctx.restore();
            }
        }

        let player = new Player();

        function rectIntersect(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function snap(value) {
            return Math.max(0, Math.min(Math.round(value / BLOCK) * BLOCK, canvas.width - BLOCK));
        }

        function snapY(value) {
            return Math.max(0, Math.min(Math.round(value / BLOCK) * BLOCK, canvas.height - BLOCK));
        }

        function getMouse(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * canvas.width / rect.width,
                y: (e.clientY - rect.top) * canvas.height / rect.height
            };
        }

        function getBlockAt(x, y) {
            for (let i = blocks.length - 1; i >= 0; i--) {
                let block = blocks[i];
                if (x >= block.x && x <= block.x + block.w && y >= block.y && y <= block.y + block.h) return block;
            }
            return null;
        }

        function addBlock(x, y) {
            let block = { x: snap(x), y: snapY(y), w: BLOCK, h: BLOCK };
            blocks.push(block);
            selectedBlock = block;
            statusText.textContent = `블록 배치: (${block.x}, ${block.y})`;
            return block;
        }

        function burstWallKickParticles(x, y, wallDir) {
            for (let i = 0; i < 10; i++) {
                let p = new Particle(x, y + (Math.random() - 0.5) * 20, i % 2 ? '#fff06a' : '#ffffff');
                p.vx = wallDir * (Math.random() * 3 + 1.5);
                p.vy = -Math.random() * 4 - 1;
                particles.push(p);
            }
        }

        function drawErrorBlock(block) {
            ctx.fillStyle = '#8b0000';
            ctx.fillRect(block.x, block.y, block.w, block.h);
            ctx.strokeStyle = '#000';
            ctx.strokeRect(block.x, block.y, block.w, block.h);
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.fillRect(block.x + 2, block.y + 2, block.w - 4, 5);
            if (block === selectedBlock) {
                ctx.strokeStyle = '#ff99cc';
                ctx.lineWidth = 3;
                ctx.strokeRect(block.x - 3, block.y - 3, block.w + 6, block.h + 6);
                ctx.lineWidth = 1;
            }
        }

        function drawGrid() {
            ctx.strokeStyle = '#151515';
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += BLOCK) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += BLOCK) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        function resetPlayer() {
            player = new Player();
            statusText.textContent = '플레이어 위치 초기화';
        }

        function clearBlocks() {
            blocks.length = 0;
            selectedBlock = null;
            statusText.textContent = '블록 전체 삭제';
        }

        function makeWallCourse() {
            clearBlocks();
            for (let y = 390; y <= 600; y += BLOCK) blocks.push({ x: 60, y, w: BLOCK, h: BLOCK });
            for (let y = 300; y <= 510; y += BLOCK) blocks.push({ x: 210, y, w: BLOCK, h: BLOCK });
            for (let x = 90; x <= 180; x += BLOCK) blocks.push({ x, y: 630, w: BLOCK, h: BLOCK });
            resetPlayer();
            statusText.textContent = '벽차기 테스트 코스 생성';
        }

        canvas.addEventListener('mousedown', e => {
            let mouse = getMouse(e);
            let block = getBlockAt(mouse.x, mouse.y);
            if (!block) block = addBlock(mouse.x, mouse.y);
            selectedBlock = block;
            draggingBlock = block;
            dragOffsetX = mouse.x - block.x;
            dragOffsetY = mouse.y - block.y;
        });

        window.addEventListener('mousemove', e => {
            if (!draggingBlock) return;
            let mouse = getMouse(e);
            draggingBlock.x = snap(mouse.x - dragOffsetX);
            draggingBlock.y = snapY(mouse.y - dragOffsetY);
        });

        window.addEventListener('mouseup', () => {
            draggingBlock = null;
        });

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            keysPressed[e.code] = true;
            if ((e.code === 'Delete' || e.code === 'Backspace') && selectedBlock) {
                let index = blocks.indexOf(selectedBlock);
                if (index >= 0) blocks.splice(index, 1);
                selectedBlock = null;
                draggingBlock = null;
                statusText.textContent = '선택 블록 삭제';
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        function update(dt) {
            player.update(dt);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(dt);
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            blocks.forEach(drawErrorBlock);
            player.draw();
            particles.forEach(p => p.draw());
            ctx.fillStyle = player.wallContactTimer > 0 && !player.isGrounded ? '#fff06a' : '#aaa';
            ctx.font = '10px "Press Start 2P"';
            ctx.fillText(player.wallContactTimer > 0 && !player.isGrounded ? 'WALL' : 'TEST', 10, 20);
        }

        function loop(now) {
            let dt = Math.min((now - lastTime) / 1000, 0.033);
            lastTime = now;
            update(dt);
            draw();
            for (let key in keysPressed) keysPressed[key] = false;
            requestAnimationFrame(loop);
        }

        makeWallCourse();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
