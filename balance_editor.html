<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris_Error.exe Balance Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a12;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-neon: #ff2a6d;
            --accent-cyan: #05d9e8;
            --text-main: #e0e0e0;
            --text-muted: #888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 42, 109, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(5, 217, 232, 0.08), transparent 25%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            padding: 30px 40px;
            border-bottom: 1px solid var(--panel-border);
            background: rgba(10, 10, 18, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 18px;
            color: var(--accent-neon);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            letter-spacing: -1px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            padding: 40px;
            flex: 1;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .editor-section {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .card-header {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header::before {
            content: '';
            display: block;
            width: 4px;
            height: 20px;
            background: var(--accent-cyan);
            border-radius: 2px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 12px 16px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            transition: all 0.2s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 2px rgba(5, 217, 232, 0.2);
        }

        /* Level Selector Tabs */
        .level-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .level-tabs::-webkit-scrollbar {
            height: 4px;
        }
        .level-tabs::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 4px;
        }

        .tab-btn {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }

        .tab-btn.active {
            background: var(--accent-cyan);
            border-color: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(5, 217, 232, 0.4);
        }

        /* Output Section */
        .output-section {
            position: sticky;
            top: 100px;
            height: calc(100vh - 140px);
            display: flex;
            flex-direction: column;
        }

        .code-container {
            flex: 1;
            background: #0d0d14;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            line-height: 1.5;
            color: #a8b2d1;
            margin-bottom: 20px;
        }

        .btn-copy {
            background: linear-gradient(135deg, var(--accent-neon), #d4145a);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(255, 42, 109, 0.4);
        }

        .btn-copy:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 42, 109, 0.6);
        }

        .btn-copy:active {
            transform: translateY(1px);
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
            .output-section {
                position: relative;
                top: 0;
                height: 600px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>[BALANCE_OS] // CONFIG</h1>
        <div style="font-size: 12px; color: var(--text-muted);">Tetris_Error.exe v1.2</div>
    </header>

    <div class="container">
        <!-- Editor Section -->
        <div class="editor-section">
            
            <!-- Score Config -->
            <div class="card">
                <div class="card-header">SCORE_CONFIG (점수 시스템)</div>
                <div class="form-grid">
                    <div class="input-group">
                        <label>1 Line Clear</label>
                        <input type="number" id="sc-line1" value="100" onchange="generateCode()">
                    </div>
                    <div class="input-group">
                        <label>2 Line Clear</label>
                        <input type="number" id="sc-line2" value="200" onchange="generateCode()">
                    </div>
                    <div class="input-group">
                        <label>3 Line Clear</label>
                        <input type="number" id="sc-line3" value="300" onchange="generateCode()">
                    </div>
                    <div class="input-group">
                        <label>4 Line Clear</label>
                        <input type="number" id="sc-line4" value="400" onchange="generateCode()">
                    </div>
                    <div class="input-group">
                        <label>Survival Per Sec</label>
                        <input type="number" id="sc-surv" value="10" onchange="generateCode()">
                    </div>
                    <div class="input-group">
                        <label>Soft Drop Per Cell</label>
                        <input type="number" id="sc-soft" value="1" onchange="generateCode()">
                    </div>
                    <div class="input-group">
                        <label>Hard Drop Per Cell</label>
                        <input type="number" id="sc-hard" value="2" onchange="generateCode()">
                    </div>
                    <div class="input-group">
                        <label>Combo Bonus</label>
                        <input type="number" id="sc-combo" value="50" onchange="generateCode()">
                    </div>
                </div>
            </div>

            <!-- Levels Config -->
            <div class="card">
                <div class="card-header">LEVELS (스테이지 난이도)</div>
                <div class="level-tabs" id="level-tabs">
                    <!-- Tabs generated by JS -->
                </div>
                <div class="form-grid" id="level-form">
                    <div class="input-group">
                        <label>Target Score</label>
                        <input type="number" id="lvl-target" onchange="updateLevelData()">
                    </div>
                    <div class="input-group">
                        <label>Spawn Interval (s)</label>
                        <input type="number" step="0.1" id="lvl-spawn" onchange="updateLevelData()">
                    </div>
                    <div class="input-group">
                        <label>Drop Interval (s)</label>
                        <input type="number" step="0.01" id="lvl-drop" onchange="updateLevelData()">
                    </div>
                    <div class="input-group">
                        <label>Laser Min (s)</label>
                        <input type="number" step="0.1" id="lvl-lmin" onchange="updateLevelData()">
                    </div>
                    <div class="input-group">
                        <label>Laser Max (s)</label>
                        <input type="number" step="0.1" id="lvl-lmax" onchange="updateLevelData()">
                    </div>
                    <div class="input-group">
                        <label>Score Multiplier</label>
                        <input type="number" step="0.1" id="lvl-mult" onchange="updateLevelData()">
                    </div>
                </div>
            </div>

            <!-- Physics Config -->
            <div class="card">
                <div class="card-header" style="color: #fff06a;">PLAYER PHYSICS (조작감)</div>
                <div class="form-grid">
                    <div class="input-group">
                        <label>Move Speed</label>
                        <input type="number" id="ph-speed" value="220" onchange="generateCode()">
                    </div>
                    <div class="input-group">
                        <label>Jump Force (Negative)</label>
                        <input type="number" id="ph-jump" value="-450" onchange="generateCode()">
                    </div>
                    <div class="input-group">
                        <label>Gravity</label>
                        <input type="number" id="ph-grav" value="1400" onchange="generateCode()">
                    </div>
                    <div class="input-group">
                        <label>Fast Fall Gravity (S key)</label>
                        <input type="number" id="ph-fast" value="3000" onchange="generateCode()">
                    </div>
                </div>
            </div>

        </div>

        <!-- Output Section -->
        <div class="output-section">
            <div class="card-header">EXPORT CODE</div>
            <pre class="code-container" id="code-output"></pre>
            <button class="btn-copy" onclick="copyCode()">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        // Initial Level Data
        const levels = [
            { name: 'BOOT SECTOR', targetScore: 10000, spawnInterval: 4.2, dropInterval: 0.85, laserMin: 5.0, laserMax: 9.0, scoreMultiplier: 1.0 },
            { name: 'PATCH ONE', targetScore: 12000, spawnInterval: 4.0, dropInterval: 0.82, laserMin: 4.8, laserMax: 8.6, scoreMultiplier: 1.1 },
            { name: 'GLITCH HALL', targetScore: 15000, spawnInterval: 3.8, dropInterval: 0.80, laserMin: 4.6, laserMax: 8.2, scoreMultiplier: 1.2 },
            { name: 'ERROR CHAMBER', targetScore: 20000, spawnInterval: 3.6, dropInterval: 0.78, laserMin: 4.4, laserMax: 7.8, scoreMultiplier: 1.3 },
            { name: 'NIGHTMARE FILE', targetScore: 25000, spawnInterval: 3.4, dropInterval: 0.76, laserMin: 4.2, laserMax: 7.4, scoreMultiplier: 1.4 },
            { name: 'RUPTURE CORE', targetScore: 32000, spawnInterval: 3.2, dropInterval: 0.74, laserMin: 4.0, laserMax: 7.0, scoreMultiplier: 1.5 },
            { name: 'BLACKOUT GRID', targetScore: 40000, spawnInterval: 3.0, dropInterval: 0.72, laserMin: 3.8, laserMax: 6.6, scoreMultiplier: 1.6 },
            { name: 'VOID STACK', targetScore: 50000, spawnInterval: 2.8, dropInterval: 0.70, laserMin: 3.6, laserMax: 6.2, scoreMultiplier: 1.7 },
            { name: 'DEVIL BIAS', targetScore: 65000, spawnInterval: 2.6, dropInterval: 0.68, laserMin: 3.4, laserMax: 5.8, scoreMultiplier: 1.8 },
            { name: 'FINAL REBOOT', targetScore: 80000, spawnInterval: 2.4, dropInterval: 0.66, laserMin: 3.2, laserMax: 5.4, scoreMultiplier: 2.0 }
        ];

        let currentLevelIdx = 0;

        function initTabs() {
            const tabsContainer = document.getElementById('level-tabs');
            tabsContainer.innerHTML = '';
            levels.forEach((lvl, idx) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${idx === currentLevelIdx ? 'active' : ''}`;
                btn.innerText = `LV ${idx + 1}`;
                btn.onclick = () => selectLevel(idx);
                tabsContainer.appendChild(btn);
            });
            loadLevelData();
        }

        function selectLevel(idx) {
            currentLevelIdx = idx;
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.className = `tab-btn ${i === currentLevelIdx ? 'active' : ''}`;
            });
            loadLevelData();
        }

        function loadLevelData() {
            const lvl = levels[currentLevelIdx];
            document.getElementById('lvl-target').value = lvl.targetScore;
            document.getElementById('lvl-spawn').value = lvl.spawnInterval;
            document.getElementById('lvl-drop').value = lvl.dropInterval;
            document.getElementById('lvl-lmin').value = lvl.laserMin;
            document.getElementById('lvl-lmax').value = lvl.laserMax;
            document.getElementById('lvl-mult').value = lvl.scoreMultiplier;
        }

        function updateLevelData() {
            levels[currentLevelIdx].targetScore = Number(document.getElementById('lvl-target').value);
            levels[currentLevelIdx].spawnInterval = Number(document.getElementById('lvl-spawn').value);
            levels[currentLevelIdx].dropInterval = Number(document.getElementById('lvl-drop').value);
            levels[currentLevelIdx].laserMin = Number(document.getElementById('lvl-lmin').value);
            levels[currentLevelIdx].laserMax = Number(document.getElementById('lvl-lmax').value);
            levels[currentLevelIdx].scoreMultiplier = Number(document.getElementById('lvl-mult').value);
            generateCode();
        }

        function generateCode() {
            // Read Score Config
            const l1 = document.getElementById('sc-line1').value;
            const l2 = document.getElementById('sc-line2').value;
            const l3 = document.getElementById('sc-line3').value;
            const l4 = document.getElementById('sc-line4').value;
            const surv = document.getElementById('sc-surv').value;
            const soft = document.getElementById('sc-soft').value;
            const hard = document.getElementById('sc-hard').value;
            const combo = document.getElementById('sc-combo').value;

            // Read Physics
            const speed = document.getElementById('ph-speed').value;
            const jump = document.getElementById('ph-jump').value;
            const grav = document.getElementById('ph-grav').value;
            const fast = document.getElementById('ph-fast').value;

            let code = `// 1. [main.html 상수 선언부 교체]
const SCORE_CONFIG = {
    lineClear: [0, ${l1}, ${l2}, ${l3}, ${l4}],
    survivalPerSec: ${surv},
    softDropPerCell: ${soft},
    hardDropPerCell: ${hard},
    comboBonus: ${combo}
};

const LEVELS = [\n`;

            levels.forEach((lvl, i) => {
                code += `    { name: '${lvl.name}', targetScore: ${lvl.targetScore}, spawnInterval: ${lvl.spawnInterval}, dropInterval: ${lvl.dropInterval}, laserMin: ${lvl.laserMin}, laserMax: ${lvl.laserMax}, scoreMultiplier: ${lvl.scoreMultiplier} }`;
                if(i < levels.length - 1) code += ",\n";
                else code += "\n];\n\n";
            });

            code += `// 2. [main.html Player 클래스 constructor 교체]
    class Player {
        constructor() {
            this.w = 20;
            this.h = 20;
            this.x = canvas.width / 2 - this.w / 2;
            this.y = ROWS * BLOCK_SIZE - this.h;
            
            // --- 조작감 밸런스 ---
            this.speed = ${speed}; 
            this.jumpForce = ${jump}; 
            this.velocityY = 0;
            this.gravity = ${grav}; 
            this.fastFallGravity = ${fast}; 
            // ---------------------
            
            this.isJumping = false;
            this.hp = 100;
            this.isInvincible = false;
            this.invincibleTimer = 0;

            this.spriteImg = null;
            this.sprites = [];
            this.currentFrame = 0;
            this.animTimer = 0;
            this.animInterval = 0.2; 
            
            this.spriteImg = new Image();
            this.spriteImg.src = 'Resources/character.png'; 
            this.spriteImg.onload = () => this.cutSprites();
        }`;

            document.getElementById('code-output').innerText = code;
        }

        function copyCode() {
            const code = document.getElementById('code-output').innerText;
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.querySelector('.btn-copy');
                const origText = btn.innerText;
                btn.innerText = 'COPIED!';
                btn.style.background = 'linear-gradient(135deg, #05d9e8, #019ba5)';
                setTimeout(() => {
                    btn.innerText = origText;
                    btn.style.background = '';
                }, 2000);
            });
        }

        // Initialize
        initTabs();
        generateCode();
    </script>
</body>
</html>
